# Local test targets and prerequisites are documented in README.md (Testing).

name: CI

# Tests execute dependency and pull-request code. They do not need a token
# capable of modifying this repository, regardless of repository defaults.
permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Include 25 short lifecycle cycles
        type: boolean
        default: true

# Cancel superseded runs on the same ref so a rapid push sequence doesn't
# pile up. Manual native checks have their own group and do not cancel normal CI.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true

# Actions use immutable commit pins. Comments record the explicit update track.
# Refresh deliberately with python3 scripts/update-ci-actions.py; review the
# diff and run make ci. Use --ref OWNER/REPO=TAG to select another major.

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    name: luacheck + stylua + doc-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Lua
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13
        with:
          luaVersion: "5.1" # LuaJIT-compatible; matches `std = "luajit"` in .luacheckrc

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6

      - name: Install luacheck
        run: luarocks install luacheck

      # The latest stylua, like the unpinned Mason package used locally. A
      # release that formats some lines differently fails this job on
      # untouched code: update locally (`:MasonToolsUpdate`), run
      # `make format`, and commit the result.
      - name: Install stylua (latest)
        run: |
          curl -sSL -o /tmp/stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          sudo unzip -o -q /tmp/stylua.zip -d /usr/local/bin
          stylua --version

      # `make check` = luacheck + stylua --check, in init.lua lua/ tests/ AND
      # in scoper.nvim's lua/ plugin/ tests/, each tree using its own
      # .luacheckrc / stylua.toml.
      - name: Lint + format check (both trees)
        timeout-minutes: 3
        run: python3 scripts/ci-run.py make check

      # `make check-docs` = the doc-sync guards listed in scripts/check-docs.sh
      # (README tree, keymaps, user commands, plugins vs lazy-lock.json,
      # version floor, template pairs). Pure POSIX shell, no Neovim — runs
      # here in the fast job.
      - name: Doc-sync guards
        timeout-minutes: 2
        run: python3 scripts/ci-run.py make check-docs

      - name: Immutable action pins and updater tests
        timeout-minutes: 2
        run: python3 scripts/ci-run.py make check-actions

  test:
    if: github.event_name != 'workflow_dispatch'
    name: plenary specs (full config, nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Keep the real-config toolchain available for plugin setup and health
      # checks. Specs disable automatic parser provisioning and exercise the
      # installer through controlled tasks. nvim-treesitter `main` expects
      # the official CLI >= 0.26.1 rather than the npm package. Search
      # integration tests need ripgrep explicitly; it is not on every image.
      - name: Set up tree-sitter CLI
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ripgrep
          tree-sitter --version
          rg --version

      # The pinned installer renames from os.tmpdir() into os.homedir().
      # Stage beside the destination: /tmp can be a separate filesystem.
      - name: Locate Neovim staging filesystem
        id: nvim-temp
        shell: bash
        run: printf 'directory=%s\n' "$HOME" >> "$GITHUB_OUTPUT"

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        env:
          TMPDIR: ${{ steps.nvim-temp.outputs.directory }}
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # Real-config smoke test + leader-key duplicate detector. First run
      # clones the plugin set via lazy.nvim (slow once; the plugin cache is
      # keyed below so later runs are fast).
      - name: Cache Neovim plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nvim/config-tests
          # Exact matches only: Lazy setup does not restore already-installed
          # plugins to lockfile revisions. A fallback can load an old upstream
          # checkout after switching to a fork. The cache contains test dependencies only.
          key: nvim-test-data-v3-${{ runner.os }}-${{ matrix.nvim }}-${{ hashFiles('lua/plugins/**/*.lua', 'lazy-lock.json') }}

      - name: Test config (smoke, leader maps, behaviour specs)
        timeout-minutes: 10
        run: python3 scripts/ci-run.py make test

  test-scoper:
    if: github.event_name != 'workflow_dispatch'
    name: scoper specs (${{ matrix.os }}, nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        nvim: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Keep Linux extraction on the install destination's filesystem.
      # Windows Node uses TEMP/TMP instead of TMPDIR, retaining its policy.
      - name: Locate Neovim staging filesystem
        if: runner.os == 'Linux'
        id: nvim-temp
        shell: bash
        run: printf 'directory=%s\n' "$HOME" >> "$GITHUB_OUTPUT"

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        env:
          TMPDIR: ${{ steps.nvim-temp.outputs.directory }}
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # scoper's harness clones only plenary (git is preinstalled on the
      # runners), so this needs no toolchain and runs the same on both OSes.
      # Invoke nvim directly rather than `make` (GNU make isn't guaranteed on
      # the Windows runner); `shell: bash` gives one command that works on
      # ubuntu and windows alike (Git Bash ships on the Windows image).
      - name: Run scoper specs
        timeout-minutes: 5
        shell: bash
        working-directory: scoper.nvim
        run: |
          py=$(command -v python3 || command -v python)
          "$py" ../scripts/ci-run.py nvim --headless --noplugin -u NONE -l tests/run.lua

      - name: Native Windows DAP, image, window-context and session fixtures
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/ci-run.py nvim --headless --noplugin -u NONE -l tests/fixtures/windows_dap_spawn.lua
          "$py" scripts/ci-run.py nvim --headless --noplugin -u NONE -l tests/fixtures/image_open.lua
          "$py" scripts/ci-run.py nvim --headless --noplugin -u NONE -l tests/fixtures/window_context.lua
          "$py" scripts/ci-run.py nvim --headless --noplugin -u NONE -l tests/fixtures/session_scope.lua

  test-seed:
    if: github.event_name != 'workflow_dispatch'
    name: offline-seed tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Runner Python and its bundled pip/distlib launcher resource on Windows:
      # no Neovim (the completeness check runs a fake nvim), no network.
      - name: Run offline-seed tests
        timeout-minutes: 3
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          py=$(command -v python3 || command -v python)
          "$py" --version
          "$py" scripts/ci-run.py "$py" -m unittest discover -s tests -p "offline_seed_test.py" -v

  portable-smoke:
    # Deliberately opt-in: no schedule, push or PR execution. A dispatch runs
    # the native smoke jobs without repeating the ordinary regression suites.
    if: github.event_name == 'workflow_dispatch'
    name: manual native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The installer renames into the home directory. Keep its extraction
      # on that filesystem on macOS too; Windows uses its native TEMP/TMP.
      - name: Locate Neovim staging filesystem
        if: runner.os == 'macOS'
        id: nvim-temp
        shell: bash
        run: printf 'directory=%s\n' "$HOME" >> "$GITHUB_OUTPUT"

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        env:
          TMPDIR: ${{ steps.nvim-temp.outputs.directory }}
        with:
          neovim: true
          version: stable

      - name: Cache dedicated smoke-test plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/portable-nvim-data
          key: portable-nvim-v1-${{ runner.os }}-${{ hashFiles('lazy-lock.json', 'lua/plugins/**/*.lua', 'scripts/portable-smoke.py') }}

      - name: Install test-only UI transport
        timeout-minutes: 1
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" -m venv "$RUNNER_TEMP/portable-python"
          if [ -f "$RUNNER_TEMP/portable-python/Scripts/python.exe" ]; then
            py="$RUNNER_TEMP/portable-python/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/portable-python/bin/python"
          fi
          "$py" -m pip install --disable-pip-version-check msgpack==1.2.1
          printf 'PORTABLE_PYTHON=%s\n' "$py" >> "$GITHUB_ENV"

      - name: Native startup and bounded lifecycle checks
        timeout-minutes: 4
        shell: bash
        env:
          PORTABLE_DATA_HOME: ${{ runner.temp }}/portable-nvim-data
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          "$PORTABLE_PYTHON" scripts/ci-run.py "$PORTABLE_PYTHON" scripts/portable-smoke.py --data-home "$PORTABLE_DATA_HOME" ${{ inputs.stress && '--stress' || '' }}

  windows-debug:
    if: github.event_name == 'workflow_dispatch'
    name: Windows PDB and clangd lifecycle
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - name: Prepare native tools and exercise repeated launches
        shell: bash
        run: python scripts/ci-run.py pwsh -NoProfile -File tests/fixtures/windows_debug_setup.ps1
